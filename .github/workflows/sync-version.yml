name: Sync version

# The plugin's version follows the latest custos release, so that Claude Code
# and the plugin directory update the plugin with each custos release.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-version

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow the latest custos release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo janalis/custos --json tagName --jq .tagName)
          version=${tag#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected custos release tag: $tag" >&2
            exit 1
          fi
          current=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$current" = "$version" ]; then
            echo "Already at custos $version."
            exit 0
          fi
          jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Follow custos $version"
          git push origin HEAD:refs/heads/main
